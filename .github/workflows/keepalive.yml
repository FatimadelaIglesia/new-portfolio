name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify site
        run: curl -fsS --max-time 30 https://fatimanewportfolio.netlify.app/api/health
      - name: Ping Vercel site
        if: always()
        continue-on-error: true
        run: curl -fsS --max-time 30 https://new-portfolio-sepia-two.vercel.app/api/health
